name: Shared core correctness
run-name: ${{ inputs.windows_text_probe && 'Windows text probe' || 'Shared core correctness' }}

on:
  pull_request:
    paths:
      - 'crates/motor/**'
      - 'crates/bunny_ui/**'
      - 'crates/bunny_ui_facade/**'
      - 'crates/bunny_ui_apple/**'
      - 'crates/bunny_ui_macos/**'
      - 'crates/bunny_ui_windows/**'
      - 'crates/bunny_ui_linux/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-clippy-regressions.py'
      - 'scripts/record-native-text-environment.py'
      - '.github/workflows/shared-core.yml'
  workflow_dispatch:
    inputs:
      windows_text_probe:
        description: Run only Windows correctness and legacy color jobs; not full CI acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shared-core-${{ github.ref }}-${{ inputs.windows_text_probe && 'probe' || 'full' }}
  cancel-in-progress: true

jobs:
  correctness:
    name: correctness (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # PRs and default dispatch keep the full matrix. A manual probe cannot
        # cancel that matrix and is explicitly named as partial verification.
        include: ${{ fromJSON(inputs.windows_text_probe && '[{"runner":"windows-2025","platform":"bunny-ui-windows"}]' || '[{"runner":"windows-2025","platform":"bunny-ui-windows"},{"runner":"macos-26","platform":"bunny-ui-apple"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .ci-base
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Pinned compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup override set 1.98.1
          rustc --version --verbose
          cargo --version
      - name: Record native font and toolchain inputs
        run: |
          python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/native-text-tools" blake3==1.0.8
          PYTHONPATH="$RUNNER_TEMP/native-text-tools" python scripts/record-native-text-environment.py --output native-text-environment.json
      - name: Task executor, normal and paranoid
        run: |
          cargo test -p bunny-ui-motor --locked --all-targets
          BUNNY_PARANOID=all cargo test -p bunny-ui-motor --locked --all-targets
      - name: Windows paragraph analysis and glyphs, normal and paranoid
        id: paragraph-boundary
        if: runner.os == 'Windows'
        run: |
          test_status=0
          cargo test -p bunny-ui-windows --locked --lib text::analysis:: -- --nocapture || test_status=$?
          BUNNY_PARANOID=all cargo test -p bunny-ui-windows --locked --lib text::analysis:: -- --nocapture || test_status=$?
          exit "$test_status"
      - name: Native platform, normal and paranoid
        # Retain public runtime results even when a paragraph oracle fails.
        # Both steps still fail the job; no error is ignored or reclassified.
        if: ${{ !cancelled() && (success() || steps.paragraph-boundary.outcome == 'failure') }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Retain the actual adapter witness on successful parity tests too.
          test_status=0
          cargo test -p "$PLATFORM" --locked --all-targets -- --nocapture || test_status=$?
          BUNNY_PARANOID=all cargo test -p "$PLATFORM" --locked --all-targets -- --nocapture || test_status=$?
          exit "$test_status"

      - name: Core default, normal and paranoid
        run: |
          cargo test -p bunny-ui-core --locked --all-targets
          BUNNY_PARANOID=all cargo test -p bunny-ui-core --locked --all-targets
      - name: Core production features, normal and paranoid
        run: |
          cargo test -p bunny-ui-core --locked --all-targets --all-features
          BUNNY_PARANOID=all cargo test -p bunny-ui-core --locked --all-targets --all-features
      - name: Facade, with the runner's shell and without one
        run: |
          cargo test -p bunny-ui --locked --all-targets
          cargo test -p bunny-ui --locked --doc
          cargo check -p bunny-ui --locked --all-targets --no-default-features
      - name: Facade entry on the targets that export one
        if: runner.os == 'macOS'
        run: |
          # `app!` writes the Android activity's symbol and the page's
          # export; the facade's own test forbids `unsafe`, so each check
          # proves the expansion builds in an app that keeps that lint.
          rustup target add aarch64-linux-android wasm32-unknown-unknown aarch64-apple-ios \
            aarch64-apple-ios-sim x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
          for target in aarch64-linux-android wasm32-unknown-unknown aarch64-apple-ios; do
            cargo check -p bunny-ui --locked --all-targets --target "$target"
          done
          # the hot build `bunny run` makes: the app links the framework's
          # shared library, so the triple is named outright, as `bunny
          # run` names it; the web has no hot build, and the feature
          # changes nothing there
          cargo test -p bunny-ui --locked --all-targets --features hot --target aarch64-apple-darwin
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-ios-sim \
            aarch64-linux-android wasm32-unknown-unknown; do
            cargo check -p bunny-ui --locked --all-targets --features hot --target "$target"
          done
      - name: macOS shell, normal and paranoid; iOS build
        if: runner.os == 'macOS'
        run: |
          cargo test -p bunny-ui-macos --locked --all-targets
          BUNNY_PARANOID=all cargo test -p bunny-ui-macos --locked --all-targets
          rustup target add aarch64-apple-ios
          cargo check -p bunny-ui-ios --locked --target aarch64-apple-ios
      - name: Strict lint diagnostic comparison
        # A failed paragraph oracle must not hide independent lint diagnostics.
        if: ${{ !cancelled() && (success() || steps.paragraph-boundary.outcome == 'failure') }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Each strict exit code stays visible, including inherited failures.
          # New diagnostics fail this separate regression gate.
          packages=(--package bunny-ui-motor --package bunny-ui-core --package "$PLATFORM")
          if [ "$RUNNER_OS" = macOS ]; then
            packages+=(--package bunny-ui-macos)
          fi
          rustup override set 1.98.1 --path .ci-base
          python scripts/check-clippy-regressions.py --baseline .ci-base \
            --output lint-evidence "${packages[@]}"
      - name: Preserve strict lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-lint-${{ matrix.runner }}
          path: |
            lint-evidence/*.jsonl
            lint-evidence/comparison.json
          if-no-files-found: warn
      - name: Preserve native text environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-text-${{ matrix.runner }}
          path: native-text-environment.json
          if-no-files-found: error

  legacy-color-layers:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Pinned compiler and native font environment
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustc --version --verbose
          cargo --version
          python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/native-text-tools" blake3==1.0.8
          PYTHONPATH="$RUNNER_TEMP/native-text-tools" python scripts/record-native-text-environment.py --output native-text-environment.json
      - name: Native layer pixels, normal and paranoid
        run: |
          cargo test -p bunny-ui-windows --locked --lib paragraph_raster_translated_svg_bitmap_and_colr_paths_match_native_pixels -- --nocapture --ignored
          BUNNY_PARANOID=all cargo test -p bunny-ui-windows --locked --lib paragraph_raster_translated_svg_bitmap_and_colr_paths_match_native_pixels -- --nocapture --ignored
      - name: Native simple spans, normal and paranoid
        run: |
          cargo test -p bunny-ui-windows --locked --lib paragraph_long_simple_spans_preserve_native_clusters_and_tracking -- --nocapture
          BUNNY_PARANOID=all cargo test -p bunny-ui-windows --locked --lib paragraph_long_simple_spans_preserve_native_clusters_and_tracking -- --nocapture
      - name: Native complex continuation, normal and paranoid
        run: |
          cargo test -p bunny-ui-windows --locked --lib text::analysis::glyphs::long_tests::continuation:: -- --nocapture
          BUNNY_PARANOID=all cargo test -p bunny-ui-windows --locked --lib text::analysis::glyphs::long_tests::continuation:: -- --nocapture
      - name: Native paragraph selection, normal and paranoid
        run: |
          test_status=0
          cargo test -p bunny-ui-windows --locked --lib text::analysis::glyphs::line::geometry::selection_tests:: -- --nocapture || test_status=$?
          BUNNY_PARANOID=all cargo test -p bunny-ui-windows --locked --lib text::analysis::glyphs::line::geometry::selection_tests:: -- --nocapture || test_status=$?
          exit "$test_status"
      - name: Preserve native text environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-text-windows-2022
          path: native-text-environment.json
          if-no-files-found: error
