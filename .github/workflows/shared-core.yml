name: Shared core correctness

on:
  pull_request:
    paths:
      - 'crates/motor/**'
      - 'crates/bunny_ui/**'
      - 'crates/bunny_ui_facade/**'
      - 'crates/bunny_ui_apple/**'
      - 'crates/bunny_ui_macos/**'
      - 'crates/bunny_ui_windows/**'
      - 'crates/bunny_ui_linux/**'
      # the preview crates: the facade-entry step tests them
      - 'crates/bunny_ui_preview/**'
      - 'crates/bunny_ui_preview_macros/**'
      - 'crates/bunny_ui_hot/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-clippy-regressions.py'
      - '.github/workflows/shared-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: correctness (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: bunny-ui-windows
          - runner: macos-26
            platform: bunny-ui-apple
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .ci-base
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Pinned compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup override set 1.98.1
          rustc --version --verbose
          cargo --version
      - name: Task executor, normal and paranoid
        run: |
          cargo test -p bunny-ui-motor --locked --all-targets
          BUNNY_PARANOID=all cargo test -p bunny-ui-motor --locked --all-targets
      - name: Native platform, normal and paranoid
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Retain the actual adapter witness on successful parity tests too.
          cargo test -p "$PLATFORM" --locked --all-targets -- --nocapture
          BUNNY_PARANOID=all cargo test -p "$PLATFORM" --locked --all-targets -- --nocapture

      - name: Core default, normal and paranoid
        run: |
          cargo test -p bunny-ui-core --locked --all-targets
          BUNNY_PARANOID=all cargo test -p bunny-ui-core --locked --all-targets
      - name: Core production features, normal and paranoid
        run: |
          cargo test -p bunny-ui-core --locked --all-targets --all-features
          BUNNY_PARANOID=all cargo test -p bunny-ui-core --locked --all-targets --all-features
      - name: Facade, with the runner's shell and without one
        run: |
          cargo test -p bunny-ui --locked --all-targets
          cargo test -p bunny-ui --locked --doc
          cargo check -p bunny-ui --locked --all-targets --no-default-features
      - name: Facade entry on the targets that export one
        if: runner.os == 'macOS'
        run: |
          # `app!` writes the Android activity's symbol and the page's
          # export; the facade's own test forbids `unsafe`, so each check
          # proves the expansion builds in an app that keeps that lint.
          rustup target add aarch64-linux-android wasm32-unknown-unknown aarch64-apple-ios \
            aarch64-apple-ios-sim x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
          for target in aarch64-linux-android wasm32-unknown-unknown aarch64-apple-ios; do
            cargo check -p bunny-ui --locked --all-targets --target "$target"
          done
          # the hot build `bunny run` makes: the app links the framework's
          # shared library, so the triple is named outright, as `bunny
          # run` names it; the web has no hot build, and the feature
          # changes nothing there
          cargo test -p bunny-ui --locked --all-targets --features hot --target aarch64-apple-darwin
          # the preview build Studio and `bunny preview` make: `#[preview]`
          # exports an entry per marked function, in an app that forbids `unsafe`
          cargo test -p bunny-ui --locked --all-targets --features preview --target aarch64-apple-darwin
          # the preview host, headless: the example's three previews render and print a line each
          BUNNY_PREVIEW_CHECK=card_light,card_dark,card_fits \
            cargo run -p bunny-ui --locked --features preview --example preview --target aarch64-apple-darwin \
            | tee preview-check.log
          grep -c '^@@bunny-preview card_' preview-check.log | grep -qx 3
          # A new app exports its real root, without adding a marked preview.
          app_dir="$RUNNER_TEMP/studio_app_preview"
          cargo run -p bunny-cli --locked -- new "$app_dir" --org io.bunny --bunny-ui-path "$PWD/crates/bunny_ui_facade"
          BUNNY_PREVIEW_CHECK=app CARGO_TARGET_DIR="$PWD/target" \
            cargo run --manifest-path "$app_dir/Cargo.toml" --features bunny-ui/preview --target aarch64-apple-darwin \
            | tee app-preview-check.log
          grep '^@@bunny-preview app commands=' app-preview-check.log
          if BUNNY_PREVIEW_CHECK=missing "$PWD/target/aarch64-apple-darwin/debug/studio_app_preview" > missing-preview-check.log; then
            cat missing-preview-check.log
            exit 1
          fi
          grep '^@@bunny-preview missing failed ' missing-preview-check.log
          cargo test -p bunny-ui-preview-macros --locked --all-targets
          # the preview wire, the reference scan and the conversions to the core's types
          cargo test -p bunny-ui-preview --locked --all-targets
          cargo test -p bunny-ui-preview --locked --all-targets --all-features
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-ios-sim \
            aarch64-linux-android wasm32-unknown-unknown; do
            cargo check -p bunny-ui --locked --all-targets --features hot --target "$target"
          done
      - name: macOS shell, normal and paranoid; iOS build
        if: runner.os == 'macOS'
        run: |
          cargo test -p bunny-ui-macos --locked --all-targets
          BUNNY_PARANOID=all cargo test -p bunny-ui-macos --locked --all-targets
          rustup target add aarch64-apple-ios
          cargo check -p bunny-ui-ios --locked --target aarch64-apple-ios
      - name: Strict lint diagnostic comparison
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Each strict exit code stays visible, including inherited failures.
          # New diagnostics fail this separate regression gate.
          packages=(--package bunny-ui-motor --package bunny-ui-core --package bunny-ui-preview-macros --package bunny-ui-preview --package "$PLATFORM")
          if [ "$RUNNER_OS" = macOS ]; then
            packages+=(--package bunny-ui-macos)
          fi
          rustup override set 1.98.1 --path .ci-base
          python scripts/check-clippy-regressions.py --baseline .ci-base \
            --output lint-evidence "${packages[@]}"
      - name: Strict preview framework lint
        if: runner.os == 'macOS'
        run: |
          cargo clippy -p bunny-ui-core -p bunny-ui-preview --locked --all-features --all-targets --no-deps -- -D warnings
          rustup toolchain install nightly-2026-07-15 --profile minimal --component clippy --target wasm32-unknown-unknown
          cargo +nightly-2026-07-15 clippy -p bunny-ui-core -p bunny-ui-preview --locked --all-features --target wasm32-unknown-unknown --no-deps -- -D warnings
      - name: Preserve strict lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-lint-${{ matrix.runner }}
          path: |
            lint-evidence/*.jsonl
            lint-evidence/comparison.json
          if-no-files-found: warn
