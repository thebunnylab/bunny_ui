name: Windows legacy text correctness

on:
  pull_request:
    paths:
      - 'crates/bunny_ui_windows/**'
      - '.github/workflows/windows-legacy-text.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-legacy-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  color-layers:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Pinned compiler and native font environment
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustc --version --verbose
          cargo --version
          python -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/native-text-tools" blake3==1.0.8
          PYTHONPATH="$RUNNER_TEMP/native-text-tools" python scripts/record-native-text-environment.py --output native-text-environment.json
      - name: Native layer pixels, normal and paranoid
        run: |
          cargo test -p bunny-ui-windows --locked --lib paragraph_raster_translated_svg_bitmap_and_colr_paths_match_native_pixels -- --nocapture
          BUNNY_PARANOID=all cargo test -p bunny-ui-windows --locked --lib paragraph_raster_translated_svg_bitmap_and_colr_paths_match_native_pixels -- --nocapture
      - name: Preserve native text environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-text-windows-2022
          path: native-text-environment.json
          if-no-files-found: error
