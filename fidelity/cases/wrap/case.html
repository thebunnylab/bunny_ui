<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="fidelity" content="width=400, height=300" />
    <title>A wrapping row</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; }
      body { font: 16px "Fid Sans"; color: #1d1d1f; }
      .page { width: 400px; height: 300px; display: flex; flex-direction: column; align-items: flex-start; background: #fff; }
      .wrap { width: 240px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .chip { height: 28px; border-radius: 14px; }
      .blue { background: #3478f6; }
      .green { background: #34c759; }
      .orange { background: #ff9500; }
      .purple { background: #af52de; }
    </style>
  </head>
  <body>
    <div class="page" data-fid="page">
      <div class="wrap" data-fid="wrap">
        <div class="chip blue" style="width: 60px" data-fid="c1"></div>
        <div class="chip green" style="width: 90px" data-fid="c2"></div>
        <div class="chip orange" style="width: 40px; height: 36px" data-fid="c3"></div>
        <div class="chip purple" style="width: 120px" data-fid="c4"></div>
        <div class="chip blue" style="width: 70px" data-fid="c5"></div>
        <div class="chip green" style="width: 50px" data-fid="c6"></div>
        <div class="chip orange" style="width: 100px" data-fid="c7"></div>
      </div>
    </div>
  </body>
</html>
