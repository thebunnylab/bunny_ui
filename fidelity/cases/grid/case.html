<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="fidelity" content="width=400, height=300" />
    <title>An equal-column grid</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; }
      body { font: 16px "Fid Sans"; color: #1d1d1f; }
      .page { width: 400px; height: 300px; display: flex; flex-direction: column; align-items: flex-start; background: #fff; }
      .grid { width: 300px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 8px; row-gap: 12px; }
      .grid > div { height: 40px; }
      .span2 { grid-column: span 2; }
      .blue { background: #3478f6; }
      .green { background: #34c759; }
      .orange { background: #ff9500; }
      .purple { background: #af52de; }
    </style>
  </head>
  <body>
    <div class="page" data-fid="page">
      <div class="grid" data-fid="grid">
        <div class="blue" data-fid="g1"></div>
        <div class="green" data-fid="g2"></div>
        <div class="orange" data-fid="g3"></div>
        <div class="purple span2" data-fid="g4"></div>
        <div class="blue" data-fid="g5"></div>
        <div class="green" data-fid="g6"></div>
        <div class="orange" data-fid="g7"></div>
      </div>
    </div>
  </body>
</html>
