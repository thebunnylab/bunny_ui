<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="fidelity" content="width=400, height=240" />
    <title>A variable face at its optical sizes</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; }
      body { font: 16px "Fid Sans"; color: #1d1d1f; }
      .page { width: 400px; height: 240px; display: flex; flex-direction: column; align-items: flex-start; background: #fff; }
      .column { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; font-family: "Inter"; }
      .s12 { font-size: 12px; line-height: 16px; }
      .s14 { font-size: 14px; line-height: 20px; }
      .s16 { font-size: 16px; line-height: 22px; }
      .s20 { font-size: 20px; line-height: 26px; }
      .s28 { font-size: 28px; line-height: 34px; }
      .bold { font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="page" data-fid="page">
      <div class="column" data-fid="column">
        <span class="s12" data-fid="s12">Compiled to WebAssembly, running in your tab.</span>
        <span class="s14" data-fid="s14">Compiled to WebAssembly, in your tab.</span>
        <span class="s16" data-fid="s16">Compiled to WebAssembly.</span>
        <span class="s16 bold" data-fid="s16-bold">Weight and size together.</span>
        <span class="s20" data-fid="s20">Running in your tab.</span>
        <span class="s28" data-fid="s28">Optical sizes</span>
      </div>
    </div>
  </body>
</html>
