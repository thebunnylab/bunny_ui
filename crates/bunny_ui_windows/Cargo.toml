[package]
name = "bunny-ui-windows"
version = "0.1.0"
edition.workspace = true
description = "bunny-ui Windows shell — native window and bitmap blit, dependency-free Win32 FFI"

[dependencies]
bunny-ui = { workspace = true, features = ["canvas", "gpu"] }

[dev-dependencies]
# tests only: the house PNG decoder reads back what WIC encodes, so the
# check does not ask the platform to grade its own work
bunny-ui = { workspace = true, features = ["canvas", "gpu", "codec"] }
# examples only (the real countries app in a native window)
countries-core.workspace = true
countries-pure.workspace = true
