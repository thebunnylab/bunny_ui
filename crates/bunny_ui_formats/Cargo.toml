[package]
name = "bunny-ui-formats"
version.workspace = true
edition.workspace = true
description = "The file formats, digests and signatures of bunny-ui on the standard library alone: SHA-1, SHA-256, SHA-512, Ed25519, base64, DEFLATE, zip, tar"
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["bunny-ui", "sha256", "deflate", "tar", "zip"]
categories = ["compression", "cryptography", "encoding"]

[features]
default = []
# Ed25519 from ed25519-dalek instead of the crate's own, behind the same
# API and with the same answers. Off, the crate is std alone.
dalek = ["dep:ed25519-dalek"]

# No dependency by default: the `bunny` command and the updater both read
# and write these formats, and neither of them carries a crate for it.
[dependencies]
ed25519-dalek = { version = "2", optional = true }

[dev-dependencies]
# the tests hold the crate's own Ed25519 to dalek's answers
ed25519-dalek = "2"
