[package]
name = "bunny-cli"
version.workspace = true
edition.workspace = true
description = "The bunny command — create, check and run bunny-ui apps on macOS, iOS, Windows, Linux, Android and the web"
license-file.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["bunny-ui", "cli", "gui", "mobile", "scaffold"]
categories = ["command-line-utilities", "development-tools", "gui"]
# The templates are data the binary embeds: without them `cargo install`
# would build a `bunny new` with nothing to write.
include = ["src/**", "templates/**", "README.md"]

[lib]
name = "bunny_cli"
path = "src/lib.rs"

[[bin]]
name = "bunny"
path = "src/main.rs"

# The dependencies are in-house, std only, the same workspace and the
# same version. `bunny-ui-preview` is the wire a preview host speaks and
# the scan that lists a crate's previews: `bunny preview` reads frames
# and lists previews through it rather than carrying a second copy of a
# frozen codec. `bunny-ui-formats` is the digests and the archives the
# updater reads back, so both sides use one copy.
[dependencies]
bunny-ui-preview = { workspace = true }
bunny-ui-formats = { workspace = true }

# The tests alone: `bunny-ui-release` and serde_json read back the
# latest.json the CLI writes by hand, to the same bytes. The binary
# itself stays on std.
[dev-dependencies]
bunny-ui-release = { workspace = true }
serde_json = { workspace = true }
