[package]
name = "bunny-ui-ios"
version.workspace = true
edition.workspace = true
description = "bunny-ui iOS shell — UIKit window, touches and the soft keyboard over the shared Apple half, dependency-free Objective-C FFI"
license-file.workspace = true
repository.workspace = true
# every example is declared below with a platform-suffixed artifact
# name; discovery would re-add the bare names and bring back the
# collision the Linux shell already paid for
autoexamples = false

[dependencies]
bunny-ui = { workspace = true, features = ["canvas", "gpu"] }
bunny-ui-apple.workspace = true

[dev-dependencies]
countries-core.workspace = true
countries-pure.workspace = true

# the example FILES are deliberate twins of the other shells'; the
# artifact names carry the platform (the Linux precedent)
[[example]]
name = "counter_window_ios"
path = "examples/counter_window.rs"

[[example]]
name = "countries_window_ios"
path = "examples/countries_window.rs"

[[example]]
name = "touch_window_ios"
path = "examples/touch_window.rs"

[[example]]
name = "letter_window_ios"
path = "examples/letter_window.rs"

[[example]]
name = "life_window_ios"
path = "examples/life_window.rs"

# Its API exists only on its own platform; docs.rs builds on Linux
# by default and would publish an empty page.
[package.metadata.docs.rs]
default-target = "aarch64-apple-ios"
targets = ["aarch64-apple-ios"]
