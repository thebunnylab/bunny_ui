[package]
name = "bunny-ui-android"
version.workspace = true
edition.workspace = true
description = "bunny-ui Android shell — a NativeActivity, its touches and the soft keyboard, presented by the shared Vulkan tier or the CPU floor, with hand-written FFI and JNI and not a single dependency"
license-file.workspace = true
repository.workspace = true
# every example is declared below with a platform-suffixed artifact
# name and as a cdylib — the activity dlopens a shared object, and
# discovery would make binaries with the bare names
autoexamples = false

[dependencies]
bunny-ui = { workspace = true, features = ["canvas", "gpu"] }
bunny-ui-vulkan.workspace = true

[dev-dependencies]
countries-core.workspace = true
countries-pure.workspace = true

# the example FILES are deliberate twins of the other shells'; the
# artifact names carry the platform (the Linux precedent), and each is
# a cdylib because that is what `android.app.NativeActivity` loads
[[example]]
name = "counter_window_android"
path = "examples/counter_window.rs"
crate-type = ["cdylib"]

[[example]]
name = "countries_window_android"
path = "examples/countries_window.rs"
crate-type = ["cdylib"]

[[example]]
name = "touch_window_android"
path = "examples/touch_window.rs"
crate-type = ["cdylib"]

[[example]]
name = "image_window_android"
path = "examples/image_window.rs"
crate-type = ["cdylib"]

[[example]]
name = "credentials_window_android"
path = "examples/credentials_window.rs"
crate-type = ["cdylib"]

[[example]]
name = "life_window_android"
path = "examples/life_window.rs"
crate-type = ["cdylib"]

# Its API exists only on its own platform; docs.rs builds on Linux
# by default and would publish an empty page.
[package.metadata.docs.rs]
default-target = "aarch64-linux-android"
targets = ["aarch64-linux-android"]
