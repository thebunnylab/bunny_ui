[package]
name = "bunny-ui-web"
version.workspace = true
edition.workspace = true
description = "bunny-ui web shell — wasm with a hand-written JS glue, presented by WebGL2 or the CPU canvas, no bindgen and no dependencies"
license-file.workspace = true
repository.workspace = true

[features]
default = ["canvas", "gpu"]
canvas = ["bunny-ui/canvas"]
# The WebGL2 tier. Off, the page presents through the CPU Surface
# and the island canvases take putImageData — today's roads.
gpu = ["bunny-ui/gpu", "canvas"]
# The hit rectangles of the last layout, readable from the page
# (`bunny_hits_*`): what a runner clicks by on a page without elements.
# Off in every shipped build.
probe = []

[dependencies]
bunny-ui.workspace = true

# Its API exists only on its own platform; docs.rs builds on Linux
# by default and would publish an empty page.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]
