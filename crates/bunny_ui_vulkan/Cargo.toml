[package]
name = "bunny-ui-vulkan"
version.workspace = true
edition.workspace = true
description = "bunny-ui Vulkan tier — the swapchain presenter and the offscreen oracle over a dlopen'd loader, shared by the Linux and Android shells"
license-file.workspace = true
repository.workspace = true

[features]
# Worlds in three dimensions, drawn by the Vulkan world pass.
3d = ["bunny-ui/3d"]

[dependencies]
bunny-ui = { workspace = true, features = ["canvas", "gpu"] }
