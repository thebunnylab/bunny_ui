[package]
name = "bunny-ui-apple"
version = "0.1.0"
edition.workspace = true
description = "bunny-ui Apple half — CoreText, ImageIO, Security and Metal through dependency-free Objective-C FFI, shared by the macOS and iOS shells"

[dependencies]
bunny-ui = { workspace = true, features = ["canvas", "gpu"] }

[features]
wgpu-surface = ["dep:wgpu", "dep:metal", "dep:foreign-types"]
# Worlds drawn by Metal itself: the world pass, its targets and its
# shaders, compiled the first time a box paints a world. Without it a
# world still shows: the CPU draws it.
3d = ["bunny-ui/3d"]

[dependencies.wgpu]
version = "27.0.1"
default-features = false
features = ["metal", "std"]
optional = true

[dependencies.metal]
version = "0.32"
optional = true

[dependencies.foreign-types]
version = "0.5"
optional = true

[dev-dependencies]
# the codecs of the house, so ImageIO can judge them (tests/codec_parity.rs)
bunny-ui = { workspace = true, features = ["canvas", "gpu", "codec"] }
pollster = "0.4"
