[package]
name = "bunny-ui-apple"
version.workspace = true
edition.workspace = true
description = "bunny-ui Apple half — CoreText, ImageIO, Security and Metal through dependency-free Objective-C FFI, shared by the macOS and iOS shells"
license-file.workspace = true
repository.workspace = true

[dependencies]
bunny-ui = { workspace = true, features = ["canvas", "gpu"] }

[features]
wgpu-surface = ["dep:wgpu", "dep:metal", "dep:foreign-types"]

[dependencies.wgpu]
version = "27.0.1"
default-features = false
features = ["metal", "std"]
optional = true

[dependencies.metal]
version = "0.32"
optional = true

[dependencies.foreign-types]
version = "0.5"
optional = true

[dev-dependencies]
# the codecs of the house, so ImageIO can judge them (tests/codec_parity.rs)
bunny-ui = { workspace = true, features = ["canvas", "gpu", "codec"] }
pollster = "0.4"

# Its API exists only on its own platform; docs.rs builds on Linux
# by default and would publish an empty page.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]
