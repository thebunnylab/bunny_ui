<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bunny_ui — sign in, in the dom, under wasm-bindgen</title>
    <!-- trunk builds the bin and wasm-bindgen writes its loader: the wasm's
         `./bunny.js` and `./bunny_gpu.js` imports resolve beside that
         loader, at the dist root. -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="signin-web" data-bindgen-target="web" />
    <!-- The framework's module glue, and the element shell it borrows:
         three files, deployed together beside the page. -->
    <link data-trunk rel="copy-file" href="../../../crates/bunny_ui_web/glue/esm/bunny.js" />
    <link data-trunk rel="copy-file" href="../../../crates/bunny_ui_web/glue/esm/bunny_gpu.js" />
    <link data-trunk rel="copy-file" href="../../../crates/bunny_ui_web/glue/glue_dom.js" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101216;
        display: grid;
        place-items: center;
      }
      /* the mount: the element mode names it `#app`, and its backdrop
         comes from the engine's theme, through the patches */
      #app {
        position: relative;
        width: 344px;
        height: 380px;
        overflow: hidden;
        border-radius: 12px;
      }
    </style>
    <!-- The boot: wasm-bindgen's loader instantiates the module and trunk
         says so with one event. The module below imports the glue first,
         and a cached wasm can be instantiated before that import has
         resolved: a listener the module registered would miss the event
         and the page would stay blank. So a classic script, which runs as
         the page is parsed, catches the event and keeps it as a promise. -->
    <script>
      window.trunkStarted = new Promise((resolve) => {
        addEventListener("TrunkApplicationStarted", (event) => resolve(event.detail), { once: true });
      });
    </script>
    <!-- The glue takes the instance from there. `attachDom` borrows the
         element shell and calls the app's own entry with the mount's box
         and the device ratio. -->
    <script type="module">
      import { attachDom } from "./bunny.js";
      const { wasm } = await window.trunkStarted;
      const started = await attachDom(wasm.memory, wasm, (width, height, scale) =>
        window.wasmBindings.boot(width, height, scale),
      );
      if (!started) console.error("signin: the glue refused the wasm (ABI)");
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
