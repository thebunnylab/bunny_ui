[package]
name = "signin-web"
version = "0.1.0"
edition.workspace = true
publish = false

# The page's module: trunk builds this bin, wasm-bindgen's loader
# instantiates it, and the page calls `boot` once the framework's module
# glue holds the instance (`web/index.html`).
[[bin]]
name = "signin-web"
path = "src/main.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
bunny-ui.workspace = true # dom-only: the page paints no pixel of its own
bunny-ui-web = { path = "../../crates/bunny_ui_web", default-features = false }
wasm-bindgen = "0.2"
