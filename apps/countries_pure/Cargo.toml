[package]
name = "countries-pure"
version = "0.1.0"
edition.workspace = true
description = "CountriesSwiftUI with the UI layer in idiomatic Rust on top of bunny-ui — same spirit, no macro"

[dependencies]
bunny-ui = { workspace = true, features = ["canvas"] }
countries-core.workspace = true

[[bin]]
name = "countries-pure"
path = "src/main.rs"
