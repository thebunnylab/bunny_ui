[workspace]
resolver = "2"
members = [
    "crates/motor",
    "crates/bunny_ui",
    "crates/bunny_ui_macos",
    "crates/bunny_ui_windows",
    "crates/bunny_ui_web",
    "crates/countries_core",
    "apps/countries_pure",
    "apps/finder_web",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bunny-ui = { path = "crates/bunny_ui" }
countries-core = { path = "crates/countries_core" }

countries-pure = { path = "apps/countries_pure" }
motor = { path = "crates/motor" }

# The wasm shipping profile — small over fast at the download border.
# The plain release profile stays untouched: it is the benchmarks'
# ruler and must not move.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
