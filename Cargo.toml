[workspace]
resolver = "2"
members = [
    "crates/motor",
    "crates/bunny_ui",
    "crates/bunny_ui_apple",
    "crates/bunny_ui_vulkan",
    "crates/bunny_ui_android",
    "crates/bunny_ui_macos",
    "crates/bunny_ui_ios",
    "crates/bunny_ui_windows",
    "crates/bunny_ui_linux",
    "crates/bunny_ui_web",
    "crates/countries_core",
    "apps/countries_pure",
    "apps/arena",
    "apps/finder_web",
    "apps/bench_web",
    "apps/landing_web",
]

[workspace.package]
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/thebunnylab/bunny_ui"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the published crates carry a version next to the path: crates.io
# resolves by version, the workspace by path
bunny-ui = { path = "crates/bunny_ui", version = "0.1.0", default-features = false }
bunny-ui-apple = { path = "crates/bunny_ui_apple", version = "0.1.0" }
bunny-ui-vulkan = { path = "crates/bunny_ui_vulkan", version = "0.1.0" }
countries-core = { path = "crates/countries_core" }

countries-pure = { path = "apps/countries_pure" }
# `motor` was taken on crates.io: the package publishes as
# `bunny-ui-motor`, and the key keeps every `use motor::` as it was
motor = { package = "bunny-ui-motor", path = "crates/motor", version = "0.1.0" }

# The wasm shipping profile — small over fast at the download border.
# The plain release profile stays untouched: it is the benchmarks'
# ruler and must not move.
[profile.web]
inherits = "release"
opt-level = "z"
# one unit for the whole binary: fat LTO already merges them, but the
# split still costs duplicated helpers. Measured, not assumed —
# `opt-level = "s"` was tried here too and came out 100 KB WORSE
codegen-units = 1
lto = true
# the name table is 17% of the download and nothing but a debugger's
# comfort: the glue never reads it, and a stack trace from a shipped
# build was never going to be read by a person anyway
strip = true
# a panic in the browser has nowhere to unwind to: the shell is one
# thread behind an FFI border, and the unwinding tables are bytes the
# download pays for a landing nobody catches
panic = "abort"

# The SPEED twin: what a benchmark ships. Baseline-tier wasm runs the
# size-optimized code several times slower, and a harness presses the
# button before the optimizer catches up — a scoreboard binary pays
# bytes for first-second speed.
[profile.webspeed]
inherits = "release"
opt-level = 3
lto = true
panic = "abort"
strip = true
codegen-units = 1
